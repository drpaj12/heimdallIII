[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heimdall"
version = "0.1.0"
description = "Heimdall III: 3D provenance viewer for Odin III flows (part of Yggdrasil III)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
heimdall = "heimdall.cli:main"

[tool.setuptools.packages.find]
include = ["heimdall*"]

[tool.setuptools.package-data]
heimdall = ["web/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
